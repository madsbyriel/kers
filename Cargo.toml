[package]
name = "keyrs"
version = "0.1.4"
edition = "2024"
description = "A library for reading key events from a keyboard"
license = "MIT"

[dependencies]
async-trait = "0.1.92"
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread"] }
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13.2", features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
